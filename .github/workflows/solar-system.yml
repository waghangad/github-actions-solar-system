name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
permissions:
  id-token: write
  contents: read
  packages: write
    
env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}
  REPOSITORY: study/demo-repo
  EKS_CLUSTER_NAME: 'demo-eks-cluster'
  REGISTRY: '992293216837.dkr.ecr.ap-south-1.amazonaws.com'

jobs:
  unit-testing:
    strategy:
      matrix:
        nodejs_version: [20]
        os: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            os: macos-latest
    name: Unit Testing
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
        - 27017:27017
    env:
      MONGO_URI: 'mongodb://localhost:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NodeJS Version ${{ matrix.nodejs_version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.nodejs_version }}
    
    - name: Cache NPM Dependancy
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json')}}
     
    - name: Install Dependencies
      run: npm install

    - name: Unit Testing
      id: unit_testing_step
      run: npm test
      
    - name: Archive Test Result
      if: steps.unit_testing_step.outcome == 'falure' || 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Test-Result-${{ matrix.nodejs_version }}-${{ matrix.os }}- ${{ github.run_id }}
        path: test-results.xml


  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    container: 
      image: node:18
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: 
          --name mongo
    env:
      MONGO_URI: 'mongodb://mongo:27017/superData'
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Cache NPM Dependancy
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json')}}
    
    - name: Install Dependencies
      run: npm install

    - name: Check Code Coverage
      continue-on-error: true
      run: npm run coverage
        
    - name: Archive Test Result
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-result
        path: coverage
        retention-days: 5


  docker:
    name: containerization
    needs: [unit-testing, code-coverage]
    runs-on:  ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        audience: sts.amazonaws.com
        aws-region: ap-south-1
        role-to-assume: arn:aws:iam::992293216837:role/github-action-oidc-Role-xta7NbBBHjdI

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      with:
        mask-password: true

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token}}

    - name: Build, and tag docker image.
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}

    - name: Test docker image
      run: |
        docker images
        docker run --name solar-system-app -d \
          -p 3000:3000 \
          -e MONGO_URI=${{ env.MONGO_URI }} \
          -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
          -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
          ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}
        
        export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
        echo $IP

        echo Testing Image URL using wget
        wget -q -O - 127.0.0.1:3000/live | grep live

    - name: Push docker image.
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}


  dev-deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        audience: sts.amazonaws.com
        aws-region: ap-south-1
        role-to-assume: arn:aws:iam::992293216837:role/github-action-oidc-Role-xta7NbBBHjdI
        
    - name: Update kubeconfig for EKS
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }}

    - uses: cschleiden/replace-tokens@v1
      with:
        tokenPrefix: '_{_'
        tokenSuffix: '_}_'
        files: '["kubernetes/development/*.yaml"]'
      env:
        NAMESPACE: development
        REPLICAS: 2
        IMAGE: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}

    - name: Check Files
      run: cat kubernetes/development/*.yaml

    - name: Create Secret
      run: |
        kubectl create namespace development
        kubectl -n development create secret generic mongo-db-creds \
        --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
        --from-literal=MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
        --from-literal=MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
        --save-config \
        --dry-run=client \
        -o yaml | kubectl apply -f -

    - name: Deploy Development
      run: kubectl apply -f kubernetes/development